name: sid

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The first version is the go directive of go.mod, the oldest Go that
        # this module supports. The second is the current release.
        go-version: [ "1.24", "1.27.2" ]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race ./...

      - name: Vet
        run: go vet ./...
